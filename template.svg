<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-labelledby="ic-title ic-desc">
  <title id="ic-title">Introspective Chat</title>
  <desc id="ic-desc">A chat transcript with a narrow message index down its left side, and a tool call whose header reads "ran uv run pytest -q" with its output shown beneath.</desc>

  <defs>
    <clipPath id="ic-card">
      <rect width="240" height="160" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#ic-card)">
    <rect width="240" height="160" fill="#161a20"/>

    <!-- the index rail: every message in the conversation, two lines each -->
    <rect x="0" y="0" width="52" height="160" fill="#10141a"/>
    <line x1="52" y1="0" x2="52" y2="160" stroke="#262d36" stroke-width="1"/>

    <!-- agent entry -->
    <rect x="8" y="17" width="34" height="3" rx="1.5" fill="#454f5b"/>
    <rect x="8" y="23" width="22" height="3" rx="1.5" fill="#454f5b"/>

    <!-- your entry: inset and tinted -->
    <rect x="7" y="42" width="38" height="15" rx="3" fill="#242c35"/>
    <rect x="11" y="46" width="28" height="3" rx="1.5" fill="#6b7683"/>
    <rect x="11" y="51.5" width="18" height="3" rx="1.5" fill="#6b7683"/>

    <!-- the entry the transcript is currently on -->
    <rect x="2.5" y="70" width="2" height="16" rx="1" fill="#d8c9a0"/>
    <rect x="8" y="73" width="34" height="3" rx="1.5" fill="#8b95a1"/>
    <rect x="8" y="79" width="26" height="3" rx="1.5" fill="#8b95a1"/>

    <rect x="7" y="98" width="38" height="15" rx="3" fill="#242c35"/>
    <rect x="11" y="102" width="28" height="3" rx="1.5" fill="#6b7683"/>
    <rect x="11" y="107.5" width="16" height="3" rx="1.5" fill="#6b7683"/>

    <rect x="8" y="129" width="34" height="3" rx="1.5" fill="#454f5b"/>
    <rect x="8" y="135" width="20" height="3" rx="1.5" fill="#454f5b"/>

    <!-- the transcript: prose, then the work it introduced -->
    <rect x="60" y="14" width="150" height="3.5" rx="1.75" fill="#414b57"/>
    <rect x="60" y="22" width="104" height="3.5" rx="1.75" fill="#333c47"/>

    <!-- a tool call: what was done, and what came back -->
    <rect x="60" y="32" width="168" height="58" rx="5" fill="#1c222a" stroke="#2c343e" stroke-width="1"/>
    <text x="68" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#c9d1da">ran</text>
    <text x="82" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#e0d3ae">uv run pytest -q</text>
    <rect x="68" y="54" width="152" height="28" rx="3" fill="#13171d"/>
    <text x="74" y="65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="6" fill="#8fae95">40 passed in 3.21s</text>
    <rect x="74" y="70" width="98" height="2.5" rx="1.25" fill="#39424d"/>
    <rect x="74" y="76" width="62" height="2.5" rx="1.25" fill="#2e3641"/>

    <rect x="60" y="98" width="168" height="32" rx="5" fill="#1c222a" stroke="#2c343e" stroke-width="1"/>
    <text x="68" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7.5" fill="#c9d1da">read</text>
    <text x="87" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#e0d3ae">scripts/run.py</text>
    <rect x="68" y="118" width="96" height="2.5" rx="1.25" fill="#39424d"/>

    <rect x="60" y="140" width="126" height="3.5" rx="1.75" fill="#2b333d"/>
    <rect x="60" y="148" width="66" height="3.5" rx="1.75" fill="#232a33"/>
  </g>
</svg>
